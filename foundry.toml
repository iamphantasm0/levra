[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# X Layer is EVM-equivalent (OP Stack). Cancun is supported; pinned explicitly
# so testnet and mainnet bytecode are byte-identical.
evm_version = "cancun"

[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC}"
xlayer_mainnet = "${XLAYER_MAINNET_RPC}"
